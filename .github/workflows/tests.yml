name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-24.04 is pinned because ubuntu-latest is now Ubuntu 26.04,
    # which no longer ships a Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Check the required output
        run: |
          python main.py > actual.txt
          diff -u <(tr -d '\r' < expected_output.txt) <(tr -d '\r' < actual.txt)
          echo "Required output matches."
